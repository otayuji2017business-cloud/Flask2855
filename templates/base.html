<!-- base.html -->
<!-- 目的：全ページで共通なHTML構造を定義 -->
<!-- ナビゲーション、CSSリンク、フラッシュメッセージなどを含む -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}名前管理アプリ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">名前管理アプリ</h1>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}" class="nav-link">入力フォーム</a></li>
                <li><a href="{{ url_for('list_persons') }}" class="nav-link">一覧表示</a></li>
            </ul>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container">
        <!-- フラッシュメッセージの表示 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- 各ページのコンテンツ（継承ページで定義） -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- フッター -->
    <footer class="footer">
        <p>&copy; 2026 名前管理アプリ - Flask + SQLAlchemy</p>
    </footer>
</body>
</html>
