<!-- index.html -->
<!-- 目的：ユーザーが名前を入力するフォーム画面 -->
<!-- 入力された名前は POST リクエストで /add に送信される -->
{% extends "base.html" %}

{% block title %}入力フォーム - 名前管理アプリ{% endblock %}

{% block content %}
<div class="form-container">
    <h2>名前を入力してください</h2>
    
    <!-- フォーム：POST メソッドで /add ルートに送信 -->
    <form method="POST" action="{{ url_for('add_person') }}" class="input-form">
        <!-- 名前入力フィールド -->
        <div class="form-group">
            <label for="name">名前:</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="例：田中太郎"
                maxlength="100"
                required
                autofocus
            >
        </div>
        
        <!-- 送信ボタン -->
        <div class="form-group">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a href="{{ url_for('list_persons') }}" class="btn btn-secondary">一覧を見る</a>
        </div>
    </form>
</div>
{% endblock %}
